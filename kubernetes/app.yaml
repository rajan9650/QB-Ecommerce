
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qb-ecommerce
  namespace: qbshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qb-ecommerce
  template:
    metadata:
      labels:
        app: qb-ecommerce
    spec:
      containers:
        - name: qb-ecommerce
          image: rajan9650/qb-ecommerce:v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: qbshop-secrets
                  key: MONGODB_URI
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: qbshop-secrets
                  key: JWT_SECRET
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: qbshop-secrets
                  key: NEXTAUTH_SECRET
            - name: NEXTAUTH_URL
              valueFrom:
                secretKeyRef:
                  name: qbshop-secrets
                  key: NEXTAUTH_URL
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qb-ecommerce
  namespace: qbshop
spec:
  type: ClusterIP
  selector:
    app: qb-ecommerce
  ports:
    - name: http
      port: 3000
      targetPort: 3000
